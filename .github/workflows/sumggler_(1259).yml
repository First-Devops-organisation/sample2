name: YASH-DevOps-Serverless/sumggler_(1259)
on:
  push:
    branches:
    - main
env:
  extensionId: azure-repo-migration-tool
  publisherId: varsha-patil
  shareWithOrganization: YashTech-DevOps
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: checkout
      uses: actions/checkout@v4.1.0
    - name: Use Node 20
      uses: actions/setup-node@v4.0.0
      with:
        node-version: 20.x
    - name: Install root dependencies
      run: npm install
    - name: Prepare Hub SDK (copy SDK.min.js)
      run: npm run build:hub
    - name: Install task dependencies
      run: npm install
      working-directory: MigrateRepoTask
    - name: Compile task
      run: npm run build
      working-directory: MigrateRepoTask
    - name: Prune dev dependencies
      run: npm prune --omit=dev
      working-directory: MigrateRepoTask
    - name: Package extension (create VSIX)
      run: npx tfx extension create --manifest-globs vss-extension.json --output-path ${{ runner.temp }}
    - name: Publish VSIX artifact
      uses: actions/upload-artifact@v4.1.0
      with:
        name: vsix
        path: "${{ runner.temp }}"
